name: Build & Push Hermes Gateway Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.hermes'
      - 'docker/hermes-entrypoint.sh'
      - 'hermes/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # hermes 依赖多，给足时间

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hermes
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sniper-bot-hermes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sniper-bot-hermes:${{ github.sha }}
          cache-from: type=gha,scope=hermes
          cache-to: type=gha,mode=max,scope=hermes
